timezone:    Asia/Shanghai
future:      false
# Set baseurl to the base path of the site eg "/mytalk"
# baseurl:     "/github-slideshow"
# The allowed values are 'rouge', 'pygments' or null.
highlighter: rouge
# markdown - Valid options are [ maruku | rdiscount | kramdown | redcarpet ]
markdown:    kramdown
lsi:         false
permalink:   "/:title"

kramdown:
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jemoji

## personalize your slide show
title:       单位平台软件开发过程
author:      Zhe Xia
description: 从立项到稳定部署与运维的健全过程

sass:
  style:     :compressed

## solarized variant (dark/light)
solarized:
  theme:     dark

slideNumber:
  format:    "c/t"

reveal:
  controls: false
  progress: true
  history: true
  keyboard: true
  overview: true
  center: true
  touch: true
  loop: false
  fragments: true
  transition: linear
  backgroundTransition: slide
  width: 1000
  height: 920
  margin: 0.1
  minScale: 0.2
  maxScale: 1.5

exclude: [
  "Gemfile",
  "Gemfile.lock",
  "vendor",
  "reveal.js/test",
  "reveal.js/index.html",
  "reveal.js/README.md",
  "reveal.js/bower.json",
  "reveal.js/Gruntfile.js",
  "reveal.js/CONTRIBUTING.md",
  "reveal.js/LICENSE",
  "reveal.js/package.json"
]
